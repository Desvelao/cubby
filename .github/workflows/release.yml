name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

jobs:
  # Gate: run the full CI workflow (build, format, vet, test, examples, lint,
  # docker build) on the tagged commit before anything is published.
  ci:
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  goreleaser:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - name: Validate tag
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          printf '%s\n' "$REF_NAME" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$' || {
            echo "tag $REF_NAME is not vMAJOR.MINOR.PATCH[-prerelease]" >&2; exit 1; }

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: src/go.mod
          cache-dependency-path: src/go.sum

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Read Go version and build date
        id: goversion
        run: |
          echo "version=$(sh scripts/check-versions.sh --print-go-version)" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      # `latest` only moves for stable tags (vX.Y.Z); prereleases such as
      # v0.1.0-alpha1 and build-metadata tags only get their own tag.
      - name: Compute image tags
        id: tags
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          {
            echo "list<<EOF"
            echo "ghcr.io/desvelao/cubby:${REF_NAME}"
            if printf '%s\n' "$REF_NAME" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
              echo "ghcr.io/desvelao/cubby:latest"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      # Gate: build the multi-arch image without pushing, so a broken image
      # fails the job before GoReleaser publishes anything. The layers are
      # cached for the push below. No QEMU: the build stage is pinned to
      # $BUILDPLATFORM and the runtime stage has no RUN instruction.
      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          platforms: linux/amd64,linux/arm64
          push: false
          build-args: |
            GO_VERSION=${{ steps.goversion.outputs.version }}
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
            DATE=${{ steps.goversion.outputs.date }}
          tags: ${{ steps.tags.outputs.list }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push GHCR image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            GO_VERSION=${{ steps.goversion.outputs.version }}
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
            DATE=${{ steps.goversion.outputs.date }}
          tags: ${{ steps.tags.outputs.list }}
          cache-from: type=gha
