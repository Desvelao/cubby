version: 1

# Demonstrates the dividers manifest option:
# - defaults.dividers (default true, left implicit here for "with-dividers")
#   generates a real divider panel between each pair of adjacent
#   shelf-packed rows within a compartment.
# - groups[].dividers: false opts a single tray out, even though its own
#   components also wrap into multiple rows.
#
# Both trays wrap their own components across two rows, so the contrast is
# visible in the exported cut list: only "with-dividers" gets an "ih-"
# (internal horizontal) divider panel.

box:
  name: "Row Dividers Demo"
  units: mm
  interior:
    width: 100
    depth: 90
    height: 40

material:
  name: "3mm Foamboard"
  thickness: 3.0
  kerf: 0.0

defaults:
  padding: 1.0
  margin: 1.5

components:
  - id: gear-a
    name: "Gear A"
    width: 30
    depth: 20
    height: 10
    qty: 4
    allowRotate: false
  - id: gear-b
    name: "Gear B"
    width: 35
    depth: 15
    height: 8
    qty: 4
    allowRotate: false

groups:
  - id: with-dividers
    name: "With Dividers (default)"
    components: [gear-a]
  - id: no-dividers
    name: "No Dividers"
    components: [gear-b]
    dividers: false
